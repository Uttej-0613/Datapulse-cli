[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse-cli"
version = "2.0.0"
description = "AI-assisted data profiling, validation, SQL analytics and visualization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.2,<3.0", "sqlalchemy>=2.0,<3.0", "sqlglot>=25.0,<30.0", "openai>=1.60,<3.0", "python-dotenv>=1.0,<2.0", "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "python-multipart>=0.0.9", "streamlit>=1.40,<2.0", "plotly>=5.24,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
datapulse = "datapulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
